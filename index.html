<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* IDEA     la entrada de una fiesta de Nochevieja en Madrid: cielo con fuegos, y debajo tu entrada
   COLOUR   noche ciruela para el cielo, crema de papel para todo lo demás, rojo de la suerte para actuar,
            oro de cava para destacar, verde uva para "sí" y "pagado"
   TYPE     Unbounded (títulos y cifras, ancha y moderna, de cartel de club) + Figtree (texto)
   LAYOUT   columna central estrecha (cabe en un móvil); la entrada se monta sobre el borde del cielo
   MEMORABLE los fuegos de verdad + la entrada troquelada con el sello de "Pagado" */
:root{color-scheme:dark;--night:#1d0618;--night2:#3a0f2c;--paper:#1d0618;--card:#2b0b24;--card2:#3a1231;--ink:#fff3e6;--mute:#cfaabd;--line:#4d1d40;
 --red:#e5242f;--red2:#ff5a63;--gold:#ffc93a;--grape:#5fae1e;--grape-bg:#2f4a17;--gold-bg:#4a3a10;--red-bg:#4f1420}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:16px}
body{margin:0;background:radial-gradient(1px 1px at 12% 18%,#ffffff55 50%,transparent 51%) 0 0/220px 260px,radial-gradient(1.5px 1.5px at 70% 60%,#ffffff40 50%,transparent 51%) 0 0/300px 340px,var(--paper);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,.big{font-family:Unbounded,Figtree,system-ui,sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
a{color:var(--gold);text-underline-offset:3px}
.hidden{display:none!important}
.wrap{width:min(100% - 32px,1080px);margin-inline:auto}
.narrow{width:min(100% - 32px,640px);margin-inline:auto}

/* ---------- cielo ---------- */
.sky{position:relative;overflow:hidden;color:#fff7ea;background:linear-gradient(180deg,transparent 55%,var(--paper) 100%),radial-gradient(120% 90% at 70% 0%,#5a1540 0%,#2a0a22 70%);padding:18px 0 120px}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.sky .wrap{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 16px Unbounded,sans-serif;letter-spacing:-.01em;color:var(--gold);text-decoration:none}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{color:#fff7ea;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px;border-radius:99px}
.nav a:hover{background:#ffffff1f}
.nav a.on{background:#fff7ea;color:var(--night)}
.hero{display:grid;justify-items:center;text-align:center;padding-top:clamp(36px,7vw,80px)}
.hero h1{font-size:clamp(38px,9.4vw,104px);line-height:.95;font-weight:800;letter-spacing:-.04em;color:#fff7ea;text-shadow:0 0 50px #e5242f55}
.hero h1 span{display:block;color:var(--gold);font-weight:500;letter-spacing:.06em;font-size:.62em;margin-top:.12em;text-shadow:0 0 40px #ffc93a55}
.when{margin:18px 0 0;font-size:clamp(17px,2.4vw,20px);font-weight:600;color:#f3d9e6}
.count{display:flex;justify-content:center;gap:clamp(8px,2.6vw,18px);margin-top:22px}
.count div{display:grid;justify-items:center;background:#ffffff14;border:1px solid #ffffff26;border-radius:16px;padding:10px 0 8px;width:clamp(68px,18vw,92px)}
.count b{font:600 clamp(24px,6vw,36px)/1.1 Unbounded,sans-serif;font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:#e8c7d7;font-weight:600}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}

/* ---------- vídeo de fondo ---------- */
.bgvid{position:fixed;inset:0;z-index:-1;background:#1d0618 var(--poster,none) center/cover no-repeat}
.bgvid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.bgvid video.on{opacity:1}
.bgshade{position:absolute;inset:0;background:linear-gradient(180deg,#1d061833 0%,#1d061855 35%,#1d0618b3 75%,#1d0618d9 100%)}
html.has-vid body{background:transparent}
html.has-vid .sky{background:linear-gradient(180deg,transparent 0%,transparent 70%,#1d061866 100%)}
html.has-vid .sky canvas{display:none}
html.has-vid .card,html.has-vid .fact,html.has-vid .ticket .body,html.has-vid .stat{background:#2b0b24cc;-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-color:#ffffff1a}
html.has-vid .ticket{background:transparent}
html.has-vid .ticket .body{border-radius:0 0 24px 24px}
html.has-vid .fact.money{background:var(--gold)}
html.has-vid .hero h1{text-shadow:0 2px 24px #000a,0 0 50px #e5242f55}
html.has-vid .when,html.has-vid .count span{text-shadow:0 1px 8px #000c}
html.has-vid .ticket .body::before,html.has-vid .ticket .body::after{display:none}
html.has-vid .ticket .stub::after{left:0;right:0}
html.has-vid .note,html.has-vid footer{text-shadow:0 1px 8px #000}
html.has-vid .count div{background:#1d061866;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@media(prefers-reduced-motion:reduce){.bgvid video{display:none}}

/* ---------- botones y campos ---------- */
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.btn,.btn2,.lk{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:99px;border:0;font-weight:800;font-size:17px;text-decoration:none;transition:transform .12s,background .12s}
.btn{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2)}
.btn:hover:not(:disabled){background:#f2333d}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.btn2{background:transparent;color:var(--ink);border:2px solid #ffffff55}
.btn2:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.sky .btn2{color:#fff7ea;border-color:#fff7ea}
.sky .btn2:hover{background:#fff7ea;color:var(--night)}
.gold{background:var(--gold);color:var(--night);box-shadow:0 4px 0 #c99500}
.gold:hover:not(:disabled){background:#ffd45f}
.green{background:var(--grape);color:#fff;box-shadow:0 4px 0 #3f7a10}
.green:hover:not(:disabled){background:#6cc025}
.sm{min-height:38px!important;padding:0 14px!important;font-size:14px!important;box-shadow:none!important}
.wide{width:100%}
button:disabled{opacity:.55;cursor:default}
.ghost{background:none;border:0;color:var(--mute);font-weight:600;padding:0 6px;min-height:40px;border-radius:10px;text-decoration:underline;text-underline-offset:3px}
.ghost:hover{color:var(--gold)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=time],input[type=search],input[type=url],input[type=date],select,textarea{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink)}
textarea{min-height:86px;resize:vertical}
/* Safari en iPhone da a fecha y hora un ancho mínimo propio que se sale de la caja */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;line-height:1.3}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}
input::placeholder,textarea::placeholder{color:#9a7489}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--grape)}
.pinbox{max-width:180px;letter-spacing:.5em;font-size:22px!important;text-align:center}
.stack-form{display:grid;gap:16px}
label.f,.f{display:grid;gap:6px;font-weight:700;font-size:15px}
label.f small,.f small{color:var(--mute);font-weight:500;font-size:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:46px;padding:0 18px;border-radius:99px;border:2px solid var(--line);background:var(--card2);font-weight:700;color:var(--mute)}
.seg button:hover{border-color:var(--ink);color:var(--ink)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg button.on[data-s=si],.seg button.on[data-p=bizum]{background:var(--grape);border-color:var(--grape);color:#fff}
.msg{font-size:15px;color:var(--mute);min-height:1.4em;margin:0}
.msg.err{color:var(--red2);font-weight:600}
.msg.ok{color:#9be05a;font-weight:600}
.warn{color:var(--red2);font-size:14px;margin:4px 0 0;font-weight:500}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:4px 12px;border-radius:99px;max-width:100%}
.pill.paid,.pill.si{background:var(--grape-bg);color:#b9f07f}.pill.quiza{background:var(--gold-bg);color:#ffd96a}.pill.unpaid{background:var(--red-bg);color:var(--red2)}.pill.no{background:#eee;color:#555}

/* ---------- la entrada (tarjeta troquelada) ---------- */
.ticket{position:relative;background:var(--card);border-radius:24px;box-shadow:0 24px 60px -20px #000000aa,0 0 0 1px #ffffff12;margin-top:-84px}
.ticket .stub{background:var(--red);color:#fff;border-radius:24px 24px 0 0;padding:20px 24px 26px;position:relative}
.ticket .stub::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;border-bottom:3px dashed #ffffff;opacity:.9}
.ticket .stub::before,.ticket .body::before{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--paper);top:-13px}
.ticket .body{position:relative;padding:26px 24px 26px}
.ticket .body::before{left:-13px;box-shadow:calc(100% * 0) 0 0 0 var(--paper)}
.ticket .body::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--paper);top:-13px;right:-13px}
.ticket .stub::before{display:none}
.ticket.solo .stub{border-radius:24px}
.ticket.solo .stub::after{display:none}
.ticket.solo{margin-bottom:22px}
@media(min-width:640px){.ticket .stub,.ticket .body{padding-left:34px;padding-right:34px}}
.tabs2{display:flex;gap:6px;background:#00000022;padding:5px;border-radius:99px;width:max-content;max-width:100%}
.tabs2 button{min-height:44px;padding:0 18px;border-radius:99px;border:0;background:transparent;color:#fff;font-weight:800;font-size:16px}
.tabs2 button.on{background:#fff;color:var(--red2)}
.stub h2{font-size:clamp(24px,5.4vw,34px);margin-top:16px}
.stub p{margin:6px 0 0;color:#ffe2e2;font-weight:500}
.stub .tabs2+p{margin-top:14px}
.stamp{display:inline-block;transform:rotate(-8deg);margin:10px 0 10px 4px;border:4px solid #fff;color:#fff;border-radius:12px;padding:4px 14px;font:800 18px Unbounded,sans-serif;letter-spacing:.02em;opacity:.95}
.stamp.paid{border-color:var(--gold);color:var(--gold)}

/* ---------- datos clave ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 0}
.fact{background:var(--card);border-radius:18px;padding:14px 16px;border:2px solid var(--line)}
.fact.money .v{color:var(--night)}
.fact .k{display:block;font-size:14px;color:var(--mute);font-weight:600}
.fact .v{display:block;font:700 clamp(16px,2.6vw,20px)/1.2 Unbounded,sans-serif;letter-spacing:-.02em;overflow-wrap:anywhere;margin-top:2px}
.fact a{font-size:14px;font-weight:700;color:var(--gold)}
.fact.money{background:var(--gold);border-color:var(--gold)}
.fact.money .k{color:#6b4a00}
@media(max-width:640px){.facts{grid-template-columns:1fr 1fr}.fact.where{grid-column:1/-1}}
.note{color:var(--mute);font-size:15px;margin:12px 0 0;text-align:center}

/* ---------- bloques ---------- */
main{padding:0 0 60px}
.block{margin-top:34px}
.block h2{font-size:clamp(22px,3.6vw,28px);margin-bottom:6px}
.block h3,.card h3{font-size:18px;margin:22px 0 8px}
.card{background:var(--card);border-radius:22px;padding:clamp(18px,3vw,28px);border:2px solid var(--line)}
.card+.card{margin-top:18px}
.card.block+.card.block{margin-top:18px}
.card h2{font-size:clamp(22px,3.6vw,28px);margin-bottom:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--card2);border:2px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:600;font-size:15px}
.chips span:nth-child(5n+1){background:var(--gold-bg);border-color:var(--gold-bg)}
.chips span:nth-child(5n+3){background:var(--grape-bg);border-color:var(--grape-bg)}
.chips span:nth-child(5n+4){background:var(--red-bg);border-color:var(--red-bg)}
.chips span.q{background:transparent;border-style:dashed;color:var(--mute)}
.chips span:nth-child(5n+1){color:#ffe08a}.chips span:nth-child(5n+3){color:#c6f58f}.chips span:nth-child(5n+4){color:#ffb3b8}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:2px dotted var(--line);font-size:15px}
.lines li b{white-space:nowrap;font-variant-numeric:tabular-nums}
.lines li.done span{color:var(--mute);text-decoration:line-through}
.lines li.tot{border:0;font-weight:800;font-size:17px}
.lines small{color:var(--mute)}
.callout{background:var(--card2);border-radius:16px;padding:16px 18px;margin-top:16px}
.callout.wa{background:#0f3a24;border:2px solid #1fa85566}
.callout.wa .btn{background:#1fa855;box-shadow:0 4px 0 #13763a}
.linkbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.linkbox input{font-size:14px;min-height:46px}
.paybox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.paybox .who{font:700 clamp(22px,4.4vw,30px)/1.1 Unbounded,sans-serif;letter-spacing:-.02em}
.paybox .num{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.due{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.due .big{font-size:clamp(44px,12vw,74px);line-height:1;font-weight:800;letter-spacing:-.04em;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.faq details{border-bottom:2px dotted var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-weight:700;font-size:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:700 22px Unbounded,sans-serif;color:var(--gold);flex:none;transition:transform .15s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 14px;color:var(--mute)}
.faqrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 0;border-bottom:2px dotted var(--line)}
.faqrow textarea{min-height:64px}
.banner{background:var(--gold);color:var(--night);padding:10px 16px;font-weight:700;text-align:center}
footer{padding:28px 0 40px;color:var(--mute);font-size:14px}
footer a{color:var(--mute)}

/* ---------- gestión y recaudador ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.stat small{color:var(--mute);font-weight:600;font-size:14px;display:block}
.stat .big{font-size:clamp(20px,2.8vw,26px);white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{min-height:44px;padding:0 18px;border-radius:99px;border:2px solid var(--line);background:var(--card2);font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--mute);text-align:start;font-weight:700;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
td input[type=text],td input[type=tel],td input[type=number],td select{min-height:42px;padding:6px 10px;font-size:15px;border-width:1px;border-radius:10px}
.tick{display:grid;place-items:center;min-width:44px;min-height:44px}
.add{display:grid;gap:8px;margin-top:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto}
.add.items{grid-template-columns:minmax(0,2fr) minmax(0,1fr) 84px 104px auto}
.add.three{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto}
@media(max-width:700px){.add,.add.items,.add.three{grid-template-columns:1fr 1fr}.add>:first-child,.add button{grid-column:1/-1}}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.col{background:var(--card2);border-radius:18px;padding:14px;display:grid;gap:8px}
.col.off{opacity:.6}
.col .meter{height:10px;background:var(--card);border-radius:99px;overflow:hidden}
.col .meter i{display:block;height:100%;background:var(--grape)}
.col .nums{font-size:14px;color:var(--mute)}
.col-list li{align-items:center}
.acts{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:0;background:var(--card2);color:var(--ink);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.chipbtn:hover{background:#ffffff26}
.chipbtn.wa{background:#1fa855;color:#fff}
.chipbtn.wa:hover{background:#25c062}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--mute)}
.tag.gold{background:var(--gold-bg);color:#ffd96a}
.tag.red{background:var(--red-bg);color:#ff8a92}
.scan{margin-bottom:18px;border-color:var(--grape)}
.selbar{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--card2);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;margin:4px 0 12px}
.selchk{display:inline-grid;place-items:center;width:40px;height:42px;vertical-align:middle}
.items-t td.first:has(.selchk){display:flex;align-items:center;gap:6px}
.items-t td.first:has(.selchk) input[type=text]{flex:1}
.meter.big{height:12px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.meter.big i{display:block;height:100%;background:var(--grape);transition:width .2s}
.scanlist{display:grid;gap:8px}

      <div class="fact"><span class="k">Hasta</span><span class="v" id="i-end">Que aguante el cuerpo</span></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.8/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script>
{
/* ================= utilidades ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)&&n>=0?n:0};
const eur=n=>{n=Number(n)||0;return n.toLocaleString('es-ES',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' €'};
const CATS=['Local','Bebida','Picoteo','Música','Decoración','Otros'];
const CFG=window.NV_CONFIG||{};
const CONFIGURED=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY);
const base=location.origin+location.pathname;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
async function copy(txt,el){try{await navigator.clipboard.writeText(txt);if(el){const o=el.textContent;el.textContent='¡Copiado!';setTimeout(()=>el.textContent=o,1600)}}catch(e){prompt('Copia este texto:',txt)}}

/* ================= API ================= */
async function rpc(fn,args={}){
 if(!CONFIGURED)throw new Error('Falta poner los datos de Supabase en config.js.');
 const h={'apikey':CFG.SUPABASE_KEY,'Content-Type':'application/json'};
 if(String(CFG.SUPABASE_KEY).startsWith('eyJ'))h.Authorization='Bearer '+CFG.SUPABASE_KEY;
 let r;try{r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)})}
 catch(e){throw new Error('No hay conexión. Prueba otra vez en un momento.')}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.hint))||'Error del servidor ('+r.status+')');
 if(j&&j.error)throw new Error(j.error);
 return j;
}

/* ================= vídeo de fondo ================= */
{const v=$('bgv'),wrap=v.parentElement,saveData=navigator.connection&&navigator.connection.saveData;
 const mq=matchMedia('(max-aspect-ratio: 4/5), (max-width: 700px)');
 const pick=()=>{const name=mq.matches?'fondo-movil':'fondo-ordenador';if(v.dataset.name===name)return;v.dataset.name=name;
  wrap.style.setProperty('--poster',`url(media/${name}.jpg)`);document.documentElement.classList.add('has-vid');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||saveData)return;
  v.classList.remove('on');v.src=`media/${name}.mp4`;v.load();const p=v.play();if(p&&p.catch)p.catch(()=>{})};
 v.addEventListener('playing',()=>v.classList.add('on'));
 document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();else if(v.src&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const p=v.play();if(p&&p.catch)p.catch(()=>{})}});
 (mq.addEventListener?mq.addEventListener('change',pick):mq.addListener(pick));pick()}

/* ================= decoración y cuenta atrás ================= */
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let fw=null;
try{if(window.Fireworks&&!reduceMotion&&!document.documentElement.classList.contains('has-vid')){fw=new Fireworks.Fireworks($('fw'),{autoresize:true,opacity:.45,acceleration:1.02,friction:.97,gravity:1.4,particles:60,traceLength:3,traceSpeed:10,explosion:5,intensity:4,flickering:40,lineStyle:'round',
 hue:{min:0,max:60},delay:{min:50,max:90},rocketsPoint:{min:15,max:85},lineWidth:{explosion:{min:1,max:3},trace:{min:1,max:2}},brightness:{min:55,max:85},decay:{min:.015,max:.03},mouse:{click:false,move:false},sound:{enabled:false}});
 const io=new IntersectionObserver(([e])=>{try{e.isIntersecting?fw.start():fw.stop()}catch(x){}});io.observe($('sky'));setTimeout(()=>{try{fw.start();fw.launch(4)}catch(x){}},400)}}catch(e){fw=null}
function party(){if(reduceMotion||!window.confetti)return;try{const c={colors:['#e5242f','#ffc93a','#5fae1e','#ffffff'],disableForReducedMotion:true};
 confetti({...c,particleCount:140,spread:80,origin:{y:.35}});setTimeout(()=>confetti({...c,particleCount:70,angle:60,spread:60,origin:{x:0,y:.5}}),250);setTimeout(()=>confetti({...c,particleCount:70,angle:120,spread:60,origin:{x:1,y:.5}}),400)}catch(e){}}
const target=new Date('2027-01-01T00:00:00+01:00').getTime(),pad=n=>String(n).padStart(2,'0');
function tick(){let t=target-Date.now();if(t<=0){document.querySelector('.count').innerHTML='<div style="width:auto;padding:10px 20px"><b>¡Feliz 2027!</b></div>';clearInterval(tm);return}
 const d=Math.floor(t/864e5);t%=864e5;const h=Math.floor(t/36e5);t%=36e5;
 $('cd-d').textContent=d;$('cd-h').textContent=pad(h);$('cd-m').textContent=pad(Math.floor(t/6e4));$('cd-s').textContent=pad(Math.floor(t%6e4/1e3))}
const tm=setInterval(tick,1000);tick();

/* ================= común ================= */
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fdate=iso=>{if(!iso)return'';const[y,m,d]=String(iso).split('-').map(Number);return `${d} de ${MONTHS[m-1]}`};
const waNum=p=>{const d=String(p||'').replace(/\D/g,'');return d.length===9?'34'+d:d.replace(/^00/,'')};
const waLink=(phone,text)=>`https://wa.me/${waNum(phone)}?text=${encodeURIComponent(text)}`;
const concept=name=>`Nochevieja – ${name}`;
const WA_RE=/^https:\/\/chat\.whatsapp\.com\/[A-Za-z0-9]+$/;
function paintInfo(ev,money){const name=ev.event_name||'Nochevieja 2026',parts=name.trim().split(/\s+/);
 $('title').innerHTML=parts.length>1?`${esc(parts.slice(0,-1).join(' '))} <span>${esc(parts.at(-1))}</span>`:esc(name);
 $('brand').textContent=name;document.title=name;
 $('i-time').textContent=ev.start_time||'22:00';$('i-place').textContent=ev.place||'Por confirmar';$('i-addr').textContent=ev.addr||'';
 $('i-map').innerHTML=ev.addr?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.addr)}" target="_blank" rel="noopener">Cómo llegar</a>`:'';
 $('i-end').textContent=ev.end_time?'Las '+ev.end_time:'Que aguante el cuerpo';
 const pp=ev.price_hint||(money&&money.per_person?eur(money.per_person):'');
 $('i-money').classList.toggle('hidden',!pp);$('i-pp').textContent=pp;$('i-ppnote').textContent=ev.price_hint?'precio orientativo':'aprox., según cuánta gente venga';
 $('i-notes').textContent=[ev.notes||'',ev.pay_deadline?`Hay que pagar antes del ${fdate(ev.pay_deadline)}.`:''].filter(Boolean).join(' ');
}
// Prepara la página: 'ticket' (inicio y ficha) o 'wide' (gestión y recaudador)
function layout(mode,title,sub){$('factsWrap').classList.toggle('hidden',mode!=='ticket');$('below').innerHTML='';$('below').className=mode==='wide'?'wrap':'narrow';
 $('view').className=mode==='wide'?'wrap':'narrow';
 if(mode==='wide'){$('view').innerHTML=`<div class="ticket solo"><div class="stub"><h2 style="margin:0">${esc(title)}</h2>${sub?`<p>${sub}</p>`:''}</div></div>`;return $('below')}
 return $('view')}
function nav(active){const tok=store.get('nv_token');
 $('nav').innerHTML=[['./','Inicio','home'],tok?['?t='+encodeURIComponent(tok),'Mi entrada','me']:['./#entrar','Entrar','home2'],['#gestion','Gestión','admin']]
  .map(([h,l,k])=>`<a href="${h}" class="${k===active?'on':''}">${l}</a>`).join('')}
const STATUS={si:'Voy',quiza:'Quizá',no:'No voy'};
const segHtml=(cur,dis='')=>`<div class="seg" role="group" aria-label="¿Vienes?">${Object.entries(STATUS).map(([k,l])=>`<button type="button" data-s="${k}" class="${cur===k?'on':''}"${dis}>${l}</button>`).join('')}</div>`;

const segVal=root=>root.querySelector('.seg:not(.pay) button.on')?.dataset.s||'si';
const PAY={bizum:'Bizum',efectivo:'Efectivo'};
const payHtml=cur=>`<div class="seg pay" role="group" aria-label="¿Cómo vas a pagar?"><button type="button" data-p="bizum" class="${cur!=='efectivo'?'on':''}">Bizum</button><button type="button" data-p="efectivo" class="${cur==='efectivo'?'on':''}">Efectivo</button></div>`;
const payVal=root=>root.querySelector('.seg.pay button.on')?.dataset.p||'bizum';
const CASH_WARN='Mejor por Bizum: con efectivo es fácil perder la cuenta. Si lo eliges, dáselo en mano a tu recaudador antes de la fiesta.';

function personalLink(tok){return base+'?t='+encodeURIComponent(tok)}
function collectorLink(tok){return base+'?r='+encodeURIComponent(tok)}
function shoppingHtml(items,money){const main=items.filter(i=>!i.opt),ex=items.filter(i=>i.opt);
 return `<ul class="lines">${main.map(i=>`<li class="${i.done?'done':''}"><span>${i.done?'✓ ':''}${esc(i.name)}</span><b>${eur(num(i.q)*num(i.p))}</b></li>`).join('')}
  <li class="tot"><span>Total</span><b>${eur(money.total)}</b></li></ul>
  ${ex.length?`<h3>Si sobra dinero</h3><ul class="lines">${ex.map(i=>`<li><span>${esc(i.name)}</span><b>${eur(num(i.q)*num(i.p))}</b></li>`).join('')}</ul><p class="sub" style="margin-top:8px">Serían ${eur(money.extra_per_person)} más por persona. De momento no cuenta.</p>`:''}`}
function confirm2(btn,label,fn){if(btn.dataset.sure){fn();return}const o=btn.textContent;btn.dataset.sure=1;btn.textContent=label;btn.style.color='var(--red2)';
 setTimeout(()=>{if(btn.isConnected){delete btn.dataset.sure;btn.textContent=o;btn.style.color=''}},3000)}
const hhmm=t=>/^\d{1,2}:\d{2}$/.test(String(t||'').trim())?String(t).trim().padStart(5,'0'):null;
function calTimes(ev){const s=hhmm(ev.start_time)||'22:00';let e=hhmm(ev.end_time);
 const sd='20261231',ed=e&&e>s?'20261231':'20270101';if(!e)e='06:00';
 return{s:sd+'T'+s.replace(':','')+'00',e:ed+'T'+e.replace(':','')+'00'}}
function calButtons(ev){const t=calTimes(ev),title=ev.event_name||'Nochevieja 2026',loc=[ev.place,ev.addr].filter(Boolean).join(', ');
 const g=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${t.s}/${t.e}&ctz=Europe/Madrid&location=${encodeURIComponent(loc)}&details=${encodeURIComponent(base)}`;
 return `<div class="row" style="margin-top:10px"><a class="btn2 sm" href="${esc(g)}" target="_blank" rel="noopener">Google Calendar</a><button class="btn2 sm" type="button" id="ics">iPhone y otros</button></div>`}
function bindIcs(ev){const b=$('ics');if(!b)return;b.addEventListener('click',()=>{const t=calTimes(ev),q=s=>String(s||'').replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Nochevieja//ES','BEGIN:VEVENT','UID:nochevieja2026@'+location.host,'DTSTAMP:20261201T000000Z',
  'DTSTART;TZID=Europe/Madrid:'+t.s,'DTEND;TZID=Europe/Madrid:'+t.e,'SUMMARY:'+q(ev.event_name||'Nochevieja 2026'),'LOCATION:'+q([ev.place,ev.addr].filter(Boolean).join(', ')),'DESCRIPTION:'+q(base),'END:VEVENT','END:VCALENDAR'].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='nochevieja-2026.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)})}

/* ================= vista: inicio ================= */
async function viewHome(){nav('home');const v=layout('ticket');
 const deQ=new URLSearchParams(location.search).get('de');if(deQ)sess.set('nv_ref',deQ.slice(0,12));
 const refCode=sess.get('nv_ref');
 const [d,inviter]=await Promise.all([rpc('public_info'),refCode?rpc('ref_name',{p_ref:refCode}).catch(()=>null):null]);paintInfo(d.event,d.money);
 const tok=store.get('nv_token'),m=d.money,ev=d.event;
 const full=m.capacity!=null&&m.spots_left===0;
 const contact=ev.admin_contact?`<b>${esc(ev.admin_contact)}</b>`:'un gestor';
 let pane=location.hash==='#entrar'?'in':'up';
 const draw=()=>{

function loadScript(src){return new Promise((ok,ko)=>{if(window.jspdf)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se ha podido cargar el generador de PDF. Prueba otra vez.'));document.head.appendChild(s)})}
function ticketCode(tok){return String(tok||'').replace(/-/g,'').slice(0,6).toUpperCase()}
// Dibuja la entrada en un canvas de 1800×760 px (se imprime a 180×76 mm)
async function drawTicket(t){
 try{await Promise.all(['800 40px Unbounded','500 40px Unbounded','700 40px Unbounded','600 20px Figtree','700 20px Figtree'].map(f=>document.fonts.load(f)))}catch(e){}
 const W=1800,H=760,S=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const U=(w,px)=>`${w} ${px}px Unbounded, Figtree, sans-serif`,F=(w,px)=>`${w} ${px}px Figtree, sans-serif`;
 const fit=(txt,w,px,max)=>{x.font=U(w,px);while(x.measureText(txt).width>max&&px>20){px-=2;x.font=U(w,px)}return px};
 // forma de entrada con esquinas redondeadas y muescas en el troquel
 x.save();x.beginPath();x.roundRect(0,0,W,H,44);x.clip();
 const g=x.createRadialGradient(W*.62,-80,40,W*.62,-80,1300);g.addColorStop(0,'#5a1540');g.addColorStop(.6,'#2a0a22');g.addColorStop(1,'#1d0618');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 let r=26;const R=()=>(r=r*16807%2147483647)/2147483647;
 for(let i=0;i<120;i++){x.globalAlpha=.2+R()*.5;x.fillStyle='#fff';x.beginPath();x.arc(R()*S,R()*H,R()<.15?2.6:1.5,0,7);x.fill()}
 x.globalAlpha=1;
 const burst=(cx,cy,k,col)=>{x.strokeStyle=col;x.fillStyle=col;x.lineCap='round';x.lineWidth=5*k;for(let a=0;a<360;a+=20){const q=a*Math.PI/180,sx=Math.sin(q),cy2=-Math.cos(q);x.beginPath();x.moveTo(cx+sx*26*k,cy+cy2*26*k);x.lineTo(cx+sx*80*k,cy+cy2*80*k);x.stroke();x.beginPath();x.arc(cx+sx*94*k,cy+cy2*94*k,5*k,0,7);x.fill()}};
 x.globalAlpha=.85;burst(1160,150,1.1,'#ffc93a');burst(1010,90,.55,'#ff5a63');burst(1230,370,.5,'#5fae1e');x.globalAlpha=1;
 // parte derecha roja
 x.fillStyle='#e5242f';x.fillRect(S,0,W-S,H);
 x.restore();
 // muescas y línea troquelada
 x.globalCompositeOperation='destination-out';[[S,0],[S,H]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,34,0,7);x.fill()});x.globalCompositeOperation='source-over';
 x.setLineDash([16,14]);x.strokeStyle='#ffffff';x.lineWidth=4;x.beginPath();x.moveTo(S,58);x.lineTo(S,H-58);x.stroke();x.setLineDash([]);
 // título
 const L=90;x.textBaseline='alphabetic';
 x.fillStyle='#fff7ea';x.font=U(800,128);x.shadowColor='#e5242f88';x.shadowBlur=40;x.fillText('Nochevieja',L,205);x.shadowBlur=0;
 x.fillStyle='#ffc93a';x.font=U(500,74);try{x.letterSpacing='14px'}catch(e){}x.fillText('2026',L+4,292);try{x.letterSpacing='0px'}catch(e){}
 // nombre
 x.fillStyle='#cfaabd';x.font=F(600,30);x.fillText('Entrada a nombre de',L,395);
 x.fillStyle='#fff7ea';const np=fit(t.name,700,66,S-L-80);x.font=U(700,np);x.fillText(t.name,L,465);
 // datos
 const cols=[['Fecha','31 dic 2026'],['Hora',t.time||'22:00'],['Lugar',t.place||'Por confirmar']];
 let cx=L;cols.forEach(([k,v],i)=>{x.fillStyle='#cfaabd';x.font=F(600,26);x.fillText(k,cx,568);x.fillStyle='#fff7ea';const max=i===2?S-cx-70:300;const p=fit(v,700,40,max);x.font=U(700,p);x.fillText(v,cx,618);cx+=i===0?330:250});
 if(t.addr){x.fillStyle='#cfaabd';x.font=F(600,26);let a=t.addr;while(x.measureText(a).width>S-L-70&&a.length>4)a=a.slice(0,-2);x.fillText(a===t.addr?a:a+'…',L,680)}
 // parte troquelada
 const C=S+(W-S)/2;x.textAlign='center';
 x.fillStyle='#ffe2e2';x.font=F(700,28);x.fillText('Entrada nº',C,130);
 x.fillStyle='#ffffff';x.font=U(800,56);x.fillText(t.code,C,200);
 x.fillStyle='#ffe2e2';x.font=F(700,28);x.fillText('Aportación',C,300);
 x.fillStyle='#ffffff';x.font=U(800,64);x.fillText(t.amount,C,372);
 // sello
 x.save();x.translate(C,530);x.rotate(-.16);const st=t.paid?'Pagada':'Pendiente de pago',sp=t.paid?52:30;x.font=U(800,sp);const sw=x.measureText(st).width+56;
 x.strokeStyle=t.paid?'#ffc93a':'#ffffff';x.fillStyle=t.paid?'#ffc93a':'#ffffff';x.lineWidth=7;x.beginPath();x.roundRect(-sw/2,-sp*.95,sw,sp*1.65,18);x.stroke();x.fillText(st,0,sp*.32);x.restore();
 x.fillStyle='#ffe2e2';x.font=F(600,24);x.fillText(location.host,C,H-60);x.textAlign='left';
 return c}

 const img=await prepTicketImage(file);
 const w=await Tesseract.createWorker('spa',1,{logger:m=>{if(m.status==='recognizing text')onProgress(m.progress)}});
 try{await w.setParameters({preserve_interword_spaces:'1'});const {data}=await w.recognize(img);return data.text}finally{await w.terminate()}}
const SKIP_RE=/\b(sub-?total|total|iva|i\.v\.a|base|cuota|cambio|entregad|efectivo|tarjeta|visa|master|importe|pagad|devoluc|redondeo|nif|cif|tel[eé]?f|fecha|hora|factura|gracias|operaci|autoriz|bizum|contactless|saldo|puntos|ahorro)/i;
const PRICE_RE=/(-?\d{1,4}(?:[.\s]\d{3})*[,.]\d{2})\s*(?:€|eur|e)?\s*[a-z*]?\s*$/i;
const QTY_X=/(\d{1,3})\s*(?:ud[s.]?\s*)?[x×*]\s*(\d{1,4}[,.]\d{2})/i;
const toNum=t=>parseFloat(String(t).replace(/[.\s](?=\d{3}\b)/g,'').replace(',','.'));
function parseTicket(text){const items=[];let total=null,pendingQ=null,lastName=null;
 const cleanName=t=>t.replace(QTY_X,' ').replace(/^\d{1,2}\s+(?=\D)/,'').replace(/\s\d{1,4}[,.]\d{2}\s*(?:€|eur)?\s*$/i,'').replace(/^\s*(?:ud[s.]?|uds?)\s+/i,'').replace(/[^\p{L}\p{N}%.,()\/ -]/gu,' ').replace(/\s+/g,' ').trim();
 const push=(name,amount,q)=>{q=q&&q>0&&q<1000?q:1;items.push({name:name.slice(0,80),amount:Math.round(amount*100)/100,q})};
 for(let raw of String(text||'').split(/\n+/)){const line=raw.replace(/[|_~`'"]/g,' ').replace(/\s+/g,' ').trim();if(line.length<2)continue;
  const m=line.match(PRICE_RE),before=m?line.slice(0,m.index):line,qx=line.match(QTY_X);
  const letters=cleanName(before).replace(/[^\p{L}]/gu,'').length;
  if(!m){ // línea sin importe: o nombre suelto, o «3 x 1,50» para la siguiente
   if(qx&&letters<2){pendingQ=parseInt(qx[1]);continue}
   if(letters>=2&&!SKIP_RE.test(line)){lastName=cleanName(line);if(qx)pendingQ=parseInt(qx[1])}
   continue}
  const amount=toNum(m[1]);if(!isFinite(amount)||amount===0){continue}
  if(/^\s*(importe\s+)?total\b|total\s*(a\s*pagar|compra|€|eur)/i.test(line)&&!/sub/i.test(line)){total=Math.abs(amount);lastName=null;pendingQ=null;continue}
  if(SKIP_RE.test(line)){lastName=null;continue}
  if(letters<2){ // «3 x 1,50   4,50» debajo del nombre
   if(qx&&lastName){push(lastName,amount,parseInt(qx[1]));lastName=null;pendingQ=null}
   else if(qx)pendingQ=parseInt(qx[1]);
   continue}

  if(qx)q=parseInt(qx[1]);else if(lead)q=parseInt(lead[1]);else if(pendingQ)q=pendingQ;
  // si hay precio unitario y no cuadra con la cantidad, nos fiamos del importe y del unitario
  if(qx){const unit=toNum(qx[2]);if(unit>0&&Math.abs(unit*q-amount)>0.05){const g=Math.round(amount/unit);if(g>=1&&Math.abs(unit*g-amount)<=0.05)q=g}}
  push(cleanName(before),amount,q);pendingQ=null;lastName=null}

  if(n!==$('p-new2').value){msg.className='msg err';msg.textContent='Los PIN no coinciden';return}
  try{await rpc('admin_change_pin',{p_pin:pin(),p_new:n});sess.set('nv_pin',n);msg.className='msg ok';msg.textContent='PIN cambiado.';e.target.reset()}catch(err){msg.className='msg err';msg.textContent=err.message}});
}

/* ================= arranque ================= */
async function route(){const q=new URLSearchParams(location.search),tok=q.get('t'),rtok=q.get('r');
 try{if(location.hash==='#gestion')await viewAdmin();else if(rtok)await viewCollector(rtok);else if(tok)await viewMe(tok);else await viewHome()}
 catch(err){$('view').innerHTML=`<section class="card"><h2>No se ha podido cargar</h2><p class="sub">${esc(err.message)}</p><button class="btn" type="button" onclick="location.reload()">Reintentar</button></section>`}}
window.addEventListener('hashchange',()=>{if(location.hash==='#gestion'||location.hash==='')route()});
route();
}
</script>
