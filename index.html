<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nochevieja 2026</title>
<meta name="description" content="Apúntate a la fiesta de Nochevieja 2026">
<meta name="theme-color" content="#1d0618">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nochevieja 2026">
<meta property="og:title" content="Nochevieja 2026 · Apúntate">
<meta property="og:description" content="El 31 de diciembre, fin de año con los amigos. Apúntate en un minuto y mira lo que te toca poner.">
<meta property="og:url" content="https://nochevieja26.github.io/">
<meta property="og:image" content="https://nochevieja26.github.io/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Nochevieja 2026: cielo nocturno con fuegos artificiales y el botón Apúntate aquí">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://nochevieja26.github.io/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e5242f'/%3E%3Cg stroke='%23ffd24d' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 12v10M32 42v10M12 32h10M42 32h10M18 18l7 7M39 39l7 7M46 18l-7 7M25 39l-7 7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* IDEA     la entrada de una fiesta de Nochevieja en Madrid: cielo con fuegos, y debajo tu entrada
   COLOUR   noche ciruela para el cielo, crema de papel para todo lo demás, rojo de la suerte para actuar,
            oro de cava para destacar, verde uva para "sí" y "pagado"
   TYPE     Unbounded (títulos y cifras, ancha y moderna, de cartel de club) + Figtree (texto)
   LAYOUT   columna central estrecha (cabe en un móvil); la entrada se monta sobre el borde del cielo
   MEMORABLE los fuegos de verdad + la entrada troquelada con el sello de "Pagado" */
:root{color-scheme:dark;--night:#1d0618;--night2:#3a0f2c;--paper:#1d0618;--card:#2b0b24;--card2:#3a1231;--ink:#fff3e6;--mute:#cfaabd;--line:#4d1d40;
 --red:#e5242f;--red2:#ff5a63;--gold:#ffc93a;--grape:#5fae1e;--grape-bg:#2f4a17;--gold-bg:#4a3a10;--red-bg:#4f1420}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:16px}
body{margin:0;background:radial-gradient(1px 1px at 12% 18%,#ffffff55 50%,transparent 51%) 0 0/220px 260px,radial-gradient(1.5px 1.5px at 70% 60%,#ffffff40 50%,transparent 51%) 0 0/300px 340px,var(--paper);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,.big{font-family:Unbounded,Figtree,system-ui,sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
a{color:var(--gold);text-underline-offset:3px}
.hidden{display:none!important}
.wrap{width:min(100% - 32px,1080px);margin-inline:auto}
.narrow{width:min(100% - 32px,640px);margin-inline:auto}

/* ---------- cielo ---------- */
.sky{position:relative;overflow:hidden;color:#fff7ea;background:linear-gradient(180deg,transparent 55%,var(--paper) 100%),radial-gradient(120% 90% at 70% 0%,#5a1540 0%,#2a0a22 70%);padding:18px 0 120px}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.sky .wrap{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 16px Unbounded,sans-serif;letter-spacing:-.01em;color:var(--gold);text-decoration:none}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{color:#fff7ea;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px;border-radius:99px}
.nav a:hover{background:#ffffff1f}
.nav a.on{background:#fff7ea;color:var(--night)}
.hero{display:grid;justify-items:center;text-align:center;padding-top:clamp(36px,7vw,80px)}
.hero h1{font-size:clamp(38px,9.4vw,104px);line-height:.95;font-weight:800;letter-spacing:-.04em;color:#fff7ea;text-shadow:0 0 50px #e5242f55}
.hero h1 span{display:block;color:var(--gold);font-weight:500;letter-spacing:.06em;font-size:.62em;margin-top:.12em;text-shadow:0 0 40px #ffc93a55}
.when{margin:18px 0 0;font-size:clamp(17px,2.4vw,20px);font-weight:600;color:#f3d9e6}
.count{display:flex;justify-content:center;gap:clamp(8px,2.6vw,18px);margin-top:22px}
.count div{display:grid;justify-items:center;background:#ffffff14;border:1px solid #ffffff26;border-radius:16px;padding:10px 0 8px;width:clamp(68px,18vw,92px)}
.count b{font:600 clamp(24px,6vw,36px)/1.1 Unbounded,sans-serif;font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:#e8c7d7;font-weight:600}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}

/* ---------- botones y campos ---------- */
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.btn,.btn2,.lk{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:99px;border:0;font-weight:800;font-size:17px;text-decoration:none;transition:transform .12s,background .12s}
.btn{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2)}
.btn:hover:not(:disabled){background:#f2333d}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.btn2{background:transparent;color:var(--ink);border:2px solid #ffffff55}
.btn2:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.sky .btn2{color:#fff7ea;border-color:#fff7ea}
.sky .btn2:hover{background:#fff7ea;color:var(--night)}
.gold{background:var(--gold);color:var(--night);box-shadow:0 4px 0 #c99500}
.gold:hover:not(:disabled){background:#ffd45f}
.green{background:var(--grape);color:#fff;box-shadow:0 4px 0 #3f7a10}
.green:hover:not(:disabled){background:#6cc025}
.sm{min-height:38px!important;padding:0 14px!important;font-size:14px!important;box-shadow:none!important}
.wide{width:100%}
button:disabled{opacity:.55;cursor:default}
.ghost{background:none;border:0;color:var(--mute);font-weight:600;padding:0 6px;min-height:40px;border-radius:10px;text-decoration:underline;text-underline-offset:3px}
.ghost:hover{color:var(--gold)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=time],input[type=search],input[type=url],input[type=date],select,textarea{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink)}
textarea{min-height:86px;resize:vertical}
input::placeholder,textarea::placeholder{color:#9a7489}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--grape)}
.pinbox{max-width:180px;letter-spacing:.5em;font-size:22px!important;text-align:center}
.stack-form{display:grid;gap:16px}
label.f,.f{display:grid;gap:6px;font-weight:700;font-size:15px}
label.f small,.f small{color:var(--mute);font-weight:500;font-size:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:46px;padding:0 18px;border-radius:99px;border:2px solid var(--line);background:var(--card2);font-weight:700;color:var(--mute)}
.seg button:hover{border-color:var(--ink);color:var(--ink)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg button.on[data-s=si],.seg button.on[data-p=bizum]{background:var(--grape);border-color:var(--grape);color:#fff}
.msg{font-size:15px;color:var(--mute);min-height:1.4em;margin:0}
.msg.err{color:var(--red2);font-weight:600}
.msg.ok{color:#9be05a;font-weight:600}
.warn{color:var(--red2);font-size:14px;margin:4px 0 0;font-weight:500}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:4px 12px;border-radius:99px;max-width:100%}
.pill.paid,.pill.si{background:var(--grape-bg);color:#b9f07f}.pill.quiza{background:var(--gold-bg);color:#ffd96a}.pill.unpaid{background:var(--red-bg);color:var(--red2)}.pill.no{background:#eee;color:#555}

/* ---------- la entrada (tarjeta troquelada) ---------- */
.ticket{position:relative;background:var(--card);border-radius:24px;box-shadow:0 24px 60px -20px #000000aa,0 0 0 1px #ffffff12;margin-top:-84px}
.ticket .stub{background:var(--red);color:#fff;border-radius:24px 24px 0 0;padding:20px 24px 26px;position:relative}
.ticket .stub::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;border-bottom:3px dashed #ffffff;opacity:.9}
.ticket .stub::before,.ticket .body::before{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--paper);top:-13px}
.ticket .body{position:relative;padding:26px 24px 26px}
.ticket .body::before{left:-13px;box-shadow:calc(100% * 0) 0 0 0 var(--paper)}
.ticket .body::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--paper);top:-13px;right:-13px}
.ticket .stub::before{display:none}
.ticket.solo .stub{border-radius:24px}
.ticket.solo .stub::after{display:none}
.ticket.solo{margin-bottom:22px}
@media(min-width:640px){.ticket .stub,.ticket .body{padding-left:34px;padding-right:34px}}
.tabs2{display:flex;gap:6px;background:#00000022;padding:5px;border-radius:99px;width:max-content;max-width:100%}
.tabs2 button{min-height:44px;padding:0 18px;border-radius:99px;border:0;background:transparent;color:#fff;font-weight:800;font-size:16px}
.tabs2 button.on{background:#fff;color:var(--red2)}
.stub h2{font-size:clamp(24px,5.4vw,34px);margin-top:16px}
.stub p{margin:6px 0 0;color:#ffe2e2;font-weight:500}
.stub .tabs2+p{margin-top:14px}
.stamp{display:inline-block;transform:rotate(-8deg);margin:10px 0 10px 4px;border:4px solid #fff;color:#fff;border-radius:12px;padding:4px 14px;font:800 18px Unbounded,sans-serif;letter-spacing:.02em;opacity:.95}
.stamp.paid{border-color:var(--gold);color:var(--gold)}

/* ---------- datos clave ---------- */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 0}
.fact{background:var(--card);border-radius:18px;padding:14px 16px;border:2px solid var(--line)}
.fact.money .v{color:var(--night)}
.fact .k{display:block;font-size:14px;color:var(--mute);font-weight:600}
.fact .v{display:block;font:700 clamp(16px,2.6vw,20px)/1.2 Unbounded,sans-serif;letter-spacing:-.02em;overflow-wrap:anywhere;margin-top:2px}
.fact a{font-size:14px;font-weight:700;color:var(--gold)}
.fact.money{background:var(--gold);border-color:var(--gold)}
.fact.money .k{color:#6b4a00}
@media(max-width:640px){.facts{grid-template-columns:1fr 1fr}.fact.where{grid-column:1/-1}}
.note{color:var(--mute);font-size:15px;margin:12px 0 0;text-align:center}

/* ---------- bloques ---------- */
main{padding:0 0 60px}
.block{margin-top:34px}
.block h2{font-size:clamp(22px,3.6vw,28px);margin-bottom:6px}
.block h3,.card h3{font-size:18px;margin:22px 0 8px}
.card{background:var(--card);border-radius:22px;padding:clamp(18px,3vw,28px);border:2px solid var(--line)}
.card+.card{margin-top:18px}
.card.block+.card.block{margin-top:18px}
.card h2{font-size:clamp(22px,3.6vw,28px);margin-bottom:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--card2);border:2px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:600;font-size:15px}
.chips span:nth-child(5n+1){background:var(--gold-bg);border-color:var(--gold-bg)}
.chips span:nth-child(5n+3){background:var(--grape-bg);border-color:var(--grape-bg)}
.chips span:nth-child(5n+4){background:var(--red-bg);border-color:var(--red-bg)}
.chips span.q{background:transparent;border-style:dashed;color:var(--mute)}
.chips span:nth-child(5n+1){color:#ffe08a}.chips span:nth-child(5n+3){color:#c6f58f}.chips span:nth-child(5n+4){color:#ffb3b8}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:2px dotted var(--line);font-size:15px}
.lines li b{white-space:nowrap;font-variant-numeric:tabular-nums}
.lines li.done span{color:var(--mute);text-decoration:line-through}
.lines li.tot{border:0;font-weight:800;font-size:17px}
.lines small{color:var(--mute)}
.callout{background:var(--card2);border-radius:16px;padding:16px 18px;margin-top:16px}
.callout.wa{background:#0f3a24;border:2px solid #1fa85566}
.callout.wa .btn{background:#1fa855;box-shadow:0 4px 0 #13763a}
.linkbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.linkbox input{font-size:14px;min-height:46px}
.paybox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.paybox .who{font:700 clamp(22px,4.4vw,30px)/1.1 Unbounded,sans-serif;letter-spacing:-.02em}
.paybox .num{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.due{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.due .big{font-size:clamp(44px,12vw,74px);line-height:1;font-weight:800;letter-spacing:-.04em;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.faq details{border-bottom:2px dotted var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-weight:700;font-size:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:700 22px Unbounded,sans-serif;color:var(--gold);flex:none;transition:transform .15s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 14px;color:var(--mute)}
.faqrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 0;border-bottom:2px dotted var(--line)}
.faqrow textarea{min-height:64px}
.banner{background:var(--gold);color:var(--night);padding:10px 16px;font-weight:700;text-align:center}
footer{padding:28px 0 40px;color:var(--mute);font-size:14px}
footer a{color:var(--mute)}

/* ---------- gestión y recaudador ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.stat small{color:var(--mute);font-weight:600;font-size:14px;display:block}
.stat .big{font-size:clamp(20px,2.8vw,26px);white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{min-height:44px;padding:0 18px;border-radius:99px;border:2px solid var(--line);background:var(--card2);font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--mute);text-align:start;font-weight:700;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
td input[type=text],td input[type=tel],td input[type=number],td select{min-height:42px;padding:6px 10px;font-size:15px;border-width:1px;border-radius:10px}
.tick{display:grid;place-items:center;min-width:44px;min-height:44px}
.add{display:grid;gap:8px;margin-top:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto}
.add.items{grid-template-columns:minmax(0,2fr) minmax(0,1fr) 84px 104px auto}
.add.three{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto}
@media(max-width:700px){.add,.add.items,.add.three{grid-template-columns:1fr 1fr}.add>:first-child,.add button{grid-column:1/-1}}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.col{background:var(--card2);border-radius:18px;padding:14px;display:grid;gap:8px}
.col.off{opacity:.6}
.col .meter{height:10px;background:var(--card);border-radius:99px;overflow:hidden}
.col .meter i{display:block;height:100%;background:var(--grape)}
.col .nums{font-size:14px;color:var(--mute)}
.col-list li{align-items:center}
@media(max-width:700px){
 .stack thead{display:none}
 .stack tr{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px 8px;padding:14px 0;border-bottom:2px solid var(--line)}
 .stack td{border:0;padding:0;display:flex;align-items:center;justify-content:space-between;gap:10px;grid-column:1}
 .stack td::before{content:attr(data-l);color:var(--mute);font-size:13px;flex:none}
 .stack td.first::before,.stack td.del::before{content:none}
 .stack td.del{grid-column:2;grid-row:1}
 .stack td input,.stack td select{max-width:65%}
 .stack td.first{display:block}.stack td.first input{max-width:none}
}
@media(max-width:560px){
 .brand{display:none}
 .top{justify-content:center}
 .nav a{padding:8px 12px}
 .sky{padding:10px 0 92px}
 .hero{padding-top:18px}
 .when{margin-top:10px;font-size:16px}
 .count{margin-top:14px;gap:8px}
 .count div{width:72px;padding:8px 0 6px;border-radius:14px}
 .ticket .body::before,.ticket .body::after{display:none}
 .ticket{margin-top:-62px}
 .ticket .stub{padding:14px 16px 20px}
 .ticket .body{padding:22px 18px}
 .ticket .stub::after{left:0;right:0}
 .tabs2{width:100%}
 .tabs2 button{flex:1;padding:0 8px;font-size:15px}
 .stub h2{margin-top:14px}
 .facts{gap:10px}
 .fact{padding:12px 14px}
 .card{border-radius:18px}
 .note{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="sky" id="sky">
  <canvas id="fw" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="./" id="brand">Nochevieja 2026</a>
      <nav class="nav" id="nav" aria-label="Menú"></nav>
    </div>
    <div class="hero">
      <h1 id="title">Nochevieja <span>2026</span></h1>
      <p class="when" id="when">31 de diciembre, a las <span id="i-time">22:00</span></p>
      <div class="count" aria-label="Cuenta atrás hasta las campanadas">
        <div><b id="cd-d">--</b><span>días</span></div><div><b id="cd-h">--</b><span>horas</span></div>
        <div><b id="cd-m">--</b><span>min</span></div><div><b id="cd-s">--</b><span>seg</span></div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="narrow" id="view"><div class="ticket"><div class="body"><p class="msg">Cargando…</p></div></div></div>
  <div class="narrow" id="factsWrap">
    <div class="facts" aria-label="Datos de la fiesta">
      <div class="fact where"><span class="k">Dónde</span><span class="v" id="i-place">Por confirmar</span><span id="i-addr" class="k" style="margin-top:4px"></span><span id="i-map"></span></div>
      <div class="fact"><span class="k">Hasta</span><span class="v" id="i-end">Que aguante el cuerpo</span></div>
      <div class="fact money"><span class="k">Cada uno pone</span><span class="v" id="i-pp">—</span><span class="k" id="i-ppnote"></span></div>
    </div>
    <p class="note" id="i-notes"></p>
  </div>
  <div class="narrow" id="below"></div>
</main>

<footer><div class="narrow row" style="justify-content:space-between"><span>¡Feliz 2027!</span><a href="#gestion" id="adminLink">Zona de gestores</a></div></footer>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.8/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script>
{
/* ================= utilidades ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)&&n>=0?n:0};
const eur=n=>{n=Number(n)||0;return n.toLocaleString('es-ES',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' €'};
const CATS=['Local','Bebida','Picoteo','Música','Decoración','Otros'];
const CFG=window.NV_CONFIG||{};
const CONFIGURED=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY);
const base=location.origin+location.pathname;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
async function copy(txt,el){try{await navigator.clipboard.writeText(txt);if(el){const o=el.textContent;el.textContent='¡Copiado!';setTimeout(()=>el.textContent=o,1600)}}catch(e){prompt('Copia este texto:',txt)}}

/* ================= API ================= */
async function rpc(fn,args={}){
 if(!CONFIGURED)throw new Error('Falta poner los datos de Supabase en config.js.');
 const h={'apikey':CFG.SUPABASE_KEY,'Content-Type':'application/json'};
 if(String(CFG.SUPABASE_KEY).startsWith('eyJ'))h.Authorization='Bearer '+CFG.SUPABASE_KEY;
 let r;try{r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)})}
 catch(e){throw new Error('No hay conexión. Prueba otra vez en un momento.')}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.hint))||'Error del servidor ('+r.status+')');
 if(j&&j.error)throw new Error(j.error);
 return j;
}

/* ================= decoración y cuenta atrás ================= */
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let fw=null;
try{if(window.Fireworks&&!reduceMotion){fw=new Fireworks.Fireworks($('fw'),{autoresize:true,opacity:.45,acceleration:1.02,friction:.97,gravity:1.4,particles:60,traceLength:3,traceSpeed:10,explosion:5,intensity:4,flickering:40,lineStyle:'round',
 hue:{min:0,max:60},delay:{min:50,max:90},rocketsPoint:{min:15,max:85},lineWidth:{explosion:{min:1,max:3},trace:{min:1,max:2}},brightness:{min:55,max:85},decay:{min:.015,max:.03},mouse:{click:false,move:false},sound:{enabled:false}});
 const io=new IntersectionObserver(([e])=>{try{e.isIntersecting?fw.start():fw.stop()}catch(x){}});io.observe($('sky'));setTimeout(()=>{try{fw.start();fw.launch(4)}catch(x){}},400)}}catch(e){fw=null}
function party(){if(reduceMotion||!window.confetti)return;try{const c={colors:['#e5242f','#ffc93a','#5fae1e','#ffffff'],disableForReducedMotion:true};
 confetti({...c,particleCount:140,spread:80,origin:{y:.35}});setTimeout(()=>confetti({...c,particleCount:70,angle:60,spread:60,origin:{x:0,y:.5}}),250);setTimeout(()=>confetti({...c,particleCount:70,angle:120,spread:60,origin:{x:1,y:.5}}),400)}catch(e){}}
const target=new Date('2027-01-01T00:00:00+01:00').getTime(),pad=n=>String(n).padStart(2,'0');
function tick(){let t=target-Date.now();if(t<=0){document.querySelector('.count').innerHTML='<div style="width:auto;padding:10px 20px"><b>¡Feliz 2027!</b></div>';clearInterval(tm);return}
 const d=Math.floor(t/864e5);t%=864e5;const h=Math.floor(t/36e5);t%=36e5;
 $('cd-d').textContent=d;$('cd-h').textContent=pad(h);$('cd-m').textContent=pad(Math.floor(t/6e4));$('cd-s').textContent=pad(Math.floor(t%6e4/1e3))}
const tm=setInterval(tick,1000);tick();

/* ================= común ================= */
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fdate=iso=>{if(!iso)return'';const[y,m,d]=String(iso).split('-').map(Number);return `${d} de ${MONTHS[m-1]}`};
const waNum=p=>{const d=String(p||'').replace(/\D/g,'');return d.length===9?'34'+d:d.replace(/^00/,'')};
const waLink=(phone,text)=>`https://wa.me/${waNum(phone)}?text=${encodeURIComponent(text)}`;
const concept=name=>`Nochevieja – ${name}`;
const WA_RE=/^https:\/\/chat\.whatsapp\.com\/[A-Za-z0-9]+$/;
function paintInfo(ev,money){const name=ev.event_name||'Nochevieja 2026',parts=name.trim().split(/\s+/);
 $('title').innerHTML=parts.length>1?`${esc(parts.slice(0,-1).join(' '))} <span>${esc(parts.at(-1))}</span>`:esc(name);
 $('brand').textContent=name;document.title=name;
 $('i-time').textContent=ev.start_time||'22:00';$('i-place').textContent=ev.place||'Por confirmar';$('i-addr').textContent=ev.addr||'';
 $('i-map').innerHTML=ev.addr?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.addr)}" target="_blank" rel="noopener">Cómo llegar</a>`:'';
 $('i-end').textContent=ev.end_time?'Las '+ev.end_time:'Que aguante el cuerpo';
 $('i-pp').textContent=money?eur(money.per_person):'—';
 $('i-ppnote').textContent=money?(money.by_confirmed?`entre los ${money.people} confirmados`:`calculado para ${money.people}`):'';
 $('i-notes').textContent=[ev.notes||'',ev.pay_deadline?`Hay que pagar antes del ${fdate(ev.pay_deadline)}.`:''].filter(Boolean).join(' ');
}
// Prepara la página: 'ticket' (inicio y ficha) o 'wide' (gestión y recaudador)
function layout(mode,title,sub){$('factsWrap').classList.toggle('hidden',mode!=='ticket');$('below').innerHTML='';$('below').className=mode==='wide'?'wrap':'narrow';
 $('view').className=mode==='wide'?'wrap':'narrow';
 if(mode==='wide'){$('view').innerHTML=`<div class="ticket solo"><div class="stub"><h2 style="margin:0">${esc(title)}</h2>${sub?`<p>${sub}</p>`:''}</div></div>`;return $('below')}
 return $('view')}
function nav(active){const tok=store.get('nv_token');
 $('nav').innerHTML=[['./','Inicio','home'],tok?['?t='+encodeURIComponent(tok),'Mi entrada','me']:['./#entrar','Entrar','home2'],['#gestion','Gestión','admin']]
  .map(([h,l,k])=>`<a href="${h}" class="${k===active?'on':''}">${l}</a>`).join('')}
const STATUS={si:'Voy',quiza:'Quizá',no:'No voy'};
const segHtml=(cur,dis='')=>`<div class="seg" role="group" aria-label="¿Vienes?">${Object.entries(STATUS).map(([k,l])=>`<button type="button" data-s="${k}" class="${cur===k?'on':''}"${dis}>${l}</button>`).join('')}</div>`;
function bindSeg(root){root.querySelectorAll('.seg').forEach(sg=>sg.addEventListener('click',e=>{const b=e.target.closest('[data-s],[data-p]');if(!b)return;sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}))}
const segVal=root=>root.querySelector('.seg:not(.pay) button.on')?.dataset.s||'si';
const PAY={bizum:'Bizum',efectivo:'Efectivo'};
const payHtml=cur=>`<div class="seg pay" role="group" aria-label="¿Cómo vas a pagar?"><button type="button" data-p="bizum" class="${cur!=='efectivo'?'on':''}">Bizum</button><button type="button" data-p="efectivo" class="${cur==='efectivo'?'on':''}">Efectivo</button></div>`;
const payVal=root=>root.querySelector('.seg.pay button.on')?.dataset.p||'bizum';
const CASH_WARN='Mejor por Bizum: con efectivo es fácil perder la cuenta. Si lo eliges, dáselo en mano a tu recaudador antes de la fiesta.';
function bindPayWarn(root,id){const w=$(id);root.querySelectorAll('.seg.pay button').forEach(b=>b.addEventListener('click',()=>{w.classList.toggle('hidden',b.dataset.p!=='efectivo')}))}
function personalLink(tok){return base+'?t='+encodeURIComponent(tok)}
function collectorLink(tok){return base+'?r='+encodeURIComponent(tok)}
function shoppingHtml(items,money){const main=items.filter(i=>!i.opt),ex=items.filter(i=>i.opt);
 return `<ul class="lines">${main.map(i=>`<li class="${i.done?'done':''}"><span>${i.done?'✓ ':''}${esc(i.name)}</span><b>${eur(num(i.q)*num(i.p))}</b></li>`).join('')}
  <li class="tot"><span>Total</span><b>${eur(money.total)}</b></li></ul>
  ${ex.length?`<h3>Si sobra dinero</h3><ul class="lines">${ex.map(i=>`<li><span>${esc(i.name)}</span><b>${eur(num(i.q)*num(i.p))}</b></li>`).join('')}</ul><p class="sub" style="margin-top:8px">Serían ${eur(money.extra_per_person)} más por persona. De momento no cuenta.</p>`:''}`}
function confirm2(btn,label,fn){if(btn.dataset.sure){fn();return}const o=btn.textContent;btn.dataset.sure=1;btn.textContent=label;btn.style.color='var(--red2)';
 setTimeout(()=>{if(btn.isConnected){delete btn.dataset.sure;btn.textContent=o;btn.style.color=''}},3000)}
const hhmm=t=>/^\d{1,2}:\d{2}$/.test(String(t||'').trim())?String(t).trim().padStart(5,'0'):null;
function calTimes(ev){const s=hhmm(ev.start_time)||'22:00';let e=hhmm(ev.end_time);
 const sd='20261231',ed=e&&e>s?'20261231':'20270101';if(!e)e='06:00';
 return{s:sd+'T'+s.replace(':','')+'00',e:ed+'T'+e.replace(':','')+'00'}}
function calButtons(ev){const t=calTimes(ev),title=ev.event_name||'Nochevieja 2026',loc=[ev.place,ev.addr].filter(Boolean).join(', ');
 const g=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${t.s}/${t.e}&ctz=Europe/Madrid&location=${encodeURIComponent(loc)}&details=${encodeURIComponent(base)}`;
 return `<div class="row" style="margin-top:10px"><a class="btn2 sm" href="${esc(g)}" target="_blank" rel="noopener">Google Calendar</a><button class="btn2 sm" type="button" id="ics">iPhone y otros</button></div>`}
function bindIcs(ev){const b=$('ics');if(!b)return;b.addEventListener('click',()=>{const t=calTimes(ev),q=s=>String(s||'').replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Nochevieja//ES','BEGIN:VEVENT','UID:nochevieja2026@'+location.host,'DTSTAMP:20261201T000000Z',
  'DTSTART;TZID=Europe/Madrid:'+t.s,'DTEND;TZID=Europe/Madrid:'+t.e,'SUMMARY:'+q(ev.event_name||'Nochevieja 2026'),'LOCATION:'+q([ev.place,ev.addr].filter(Boolean).join(', ')),'DESCRIPTION:'+q(base),'END:VEVENT','END:VCALENDAR'].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='nochevieja-2026.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)})}

/* ================= vista: inicio ================= */
async function viewHome(){nav('home');const v=layout('ticket');
 const d=await rpc('public_info');paintInfo(d.event,d.money);
 const tok=store.get('nv_token'),si=d.coming.filter(c=>c.status==='si'),qz=d.coming.filter(c=>c.status==='quiza'),m=d.money,ev=d.event;
 const full=m.capacity!=null&&m.spots_left===0;
 const contact=ev.admin_contact?`<b>${esc(ev.admin_contact)}</b>`:'un gestor';
 let pane=location.hash==='#entrar'?'in':'up';
 const draw=()=>{
  const stubUp=!ev.signups_open?`<h2>Inscripciones cerradas</h2><p>El plazo terminó${ev.signup_deadline?' el '+fdate(ev.signup_deadline):''}. Si aún quieres venir, habla con ${contact}.</p>`
   :tok?`<h2>Ya estás dentro</h2><p>Abajo puedes apuntar a otra persona desde este móvil.</p>`
   :`<p>Un minuto y estás dentro.${ev.signup_deadline?` Hasta el ${fdate(ev.signup_deadline)}.`:''}${m.capacity!=null?(full?' Aforo completo: entrarás en lista de espera.':` Quedan ${m.spots_left} plazas.`):''}</p>`;
  v.innerHTML=`<div class="ticket" id="apuntarme">
   <div class="stub"><div class="tabs2" role="tablist"><button type="button" role="tab" data-pane="up" class="${pane==='up'?'on':''}" aria-selected="${pane==='up'}">Me apunto</button><button type="button" role="tab" data-pane="in" class="${pane==='in'?'on':''}" aria-selected="${pane==='in'}">Ya estoy dentro</button></div>
    ${pane==='up'?stubUp:`<p>Entra con tu teléfono y tu PIN para ver tu entrada.</p>`}</div>
   <div class="body" id="entrar">
   ${pane==='in'?`<form class="stack-form" id="login" autocomplete="on">
     <label class="f">Teléfono<input type="tel" id="l-phone" required maxlength="30" inputmode="tel" autocomplete="tel" placeholder="600 000 000"></label>
     <label class="f">PIN<input type="password" id="l-pin" class="pinbox" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password"></label>
     <button class="btn wide" type="submit" id="l-go">Ver mi entrada</button>
     <p class="msg" id="l-msg" aria-live="polite"></p>
     <p class="sub" style="margin:0">¿Olvidaste el PIN? Pide tu enlace a ${contact} y crea uno nuevo.</p></form>`
   :tok&&ev.signups_open&&!pane2?`<a class="btn wide" href="?t=${encodeURIComponent(tok)}">Ver mi entrada</a>
     <p style="margin:14px 0 0;text-align:center"><button class="ghost" id="other" type="button">Apuntar a otra persona</button></p>`
   :!ev.signups_open?`<p style="margin:0">¿Ya te apuntaste? <button class="ghost" type="button" data-pane="in" style="padding:0">Entra a tu entrada</button></p>`
   :`<form class="stack-form" id="signup" autocomplete="on">
     <label class="f">Tu nombre<input type="text" id="s-name" required maxlength="60" autocomplete="name"></label>
     <label class="f">Teléfono<small>Para que nadie se apunte dos veces. ¿Prefieres no darlo? Habla con ${contact}.</small><input type="tel" id="s-phone" required maxlength="30" autocomplete="tel" inputmode="tel" placeholder="600 000 000"></label>
     <label class="f">Inventa un PIN de 4 cifras<small>Con tu teléfono y este PIN vuelves a entrar desde cualquier móvil.</small><input type="password" id="s-pin" class="pinbox" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password"></label>
     <div class="f">¿Vienes?${segHtml('si')}</div>
     <div class="f">¿Cómo pagarás tu parte?${payHtml('bizum')}<p class="warn hidden" id="s-warn">${CASH_WARN}</p></div>
     <button class="btn wide" type="submit" id="s-go">Apuntarme</button>
     <p class="msg" id="s-msg" aria-live="polite"></p></form>`}
   </div></div>`;
  bindSeg(v);if($('s-warn'))bindPayWarn(v,'s-warn');
  v.querySelectorAll('[data-pane]').forEach(b=>b.addEventListener('click',()=>{pane=b.dataset.pane;pane2=false;draw();(pane==='in'?$('l-phone'):$('s-name'))?.focus()}));
  $('other')&&$('other').addEventListener('click',()=>{pane2=true;draw();$('s-name')?.focus()});
  $('login')&&$('login').addEventListener('submit',async e=>{e.preventDefault();const msg=$('l-msg');msg.className='msg';msg.textContent='Comprobando…';$('l-go').disabled=true;
   try{const r=await rpc('login',{p_phone:$('l-phone').value,p_pin:$('l-pin').value});store.set('nv_token',r.token);location.href='?t='+encodeURIComponent(r.token)}
   catch(err){msg.className='msg err';msg.textContent=err.message;$('l-go').disabled=false}});
  $('signup')&&$('signup').addEventListener('submit',async e=>{e.preventDefault();const name=$('s-name').value.trim();if(!name)return;
   $('s-go').disabled=true;$('s-msg').className='msg';$('s-msg').textContent='Apuntándote…';
   try{const t=await rpc('signup',{p_name:name,p_phone:$('s-phone').value,p_status:segVal($('signup')),p_pay:payVal($('signup')),p_pin:$('s-pin').value});
    if(!store.get('nv_token'))store.set('nv_token',t);location.href='?t='+encodeURIComponent(t)+'&nuevo=1'}
   catch(err){$('s-msg').className='msg err';$('s-msg').textContent=err.message;$('s-go').disabled=false}});
 };
 let pane2=false;draw();
 $('below').innerHTML=`<div>
   <section class="card block" aria-labelledby="h-w"><h2 id="h-w">Quién viene</h2>
    <p class="sub">${si.length} ${si.length===1?'confirmado':'confirmados'}${qz.length?` y ${qz.length} en duda`:''}${m.espera?`, ${m.espera} en lista de espera`:''}.</p>
    <div class="chips">${si.map(c=>`<span>${esc(c.name)}</span>`).join('')}${qz.map(c=>`<span class="q" title="En duda">${esc(c.name)}?</span>`).join('')}${d.coming.length?'':'<span class="q">Todavía nadie. Estrena tú la lista.</span>'}</div>
   </section>
   <section class="card block" aria-labelledby="h-s"><h2 id="h-s">En qué se va el dinero</h2>
    <p class="sub">Local, hielo, vasos y música los pagamos entre todos. Tú solo traes tu bebida. Al apuntarte te toca por sorteo a quién hacerle el Bizum.</p>${shoppingHtml(d.items,m)}</section>
   ${(ev.faq||[]).length?`<section class="card block faq" aria-labelledby="h-f"><h2 id="h-f">Preguntas frecuentes</h2>
    ${ev.faq.map(f=>`<details><summary>${esc(f.q)}</summary>${f.a?`<p>${esc(f.a)}</p>`:''}</details>`).join('')}
    ${ev.admin_contact?`<p class="sub" style="margin:10px 0 0">¿Otra duda? Pregunta a ${esc(ev.admin_contact)} o en el grupo.</p>`:''}</section>`:''}
  </div>`;
 if(location.hash==='#apuntarme'||location.hash==='#entrar')setTimeout(()=>$('apuntarme')?.scrollIntoView({behavior:'smooth'}),50);
}

/* ================= vista: mi entrada ================= */
async function viewMe(tok){
 const d=await rpc('me',{p_token:tok});
 if(!d){nav('');const v=layout('ticket');v.innerHTML=`<div class="ticket"><div class="stub"><h2 style="margin:0">Este enlace no funciona</h2><p>Puede que te hayan borrado de la lista o que el enlace esté mal copiado.</p></div><div class="body"><a class="btn wide" href="./#entrar">Entrar con mi teléfono</a></div></div>`;
  if(store.get('nv_token')===tok)store.del('nv_token');const r=await rpc('public_info');paintInfo(r.event,r.money);return}
 if(!store.get('nv_token'))store.set('nv_token',tok);
 nav(store.get('nv_token')===tok?'me':'');paintInfo(d.event,d.money);const v=layout('ticket');
 const g=d.guest,m=d.money,ev=d.event,c=d.collector,link=personalLink(tok),isNew=new URLSearchParams(location.search).has('nuevo');
 const wa=WA_RE.test(d.whatsapp_url||'')?d.whatsapp_url:'',cash=g.pay_method==='efectivo',waiting=g.status==='espera',out=g.status==='no';
 const stub=out?`<p style="margin:0">Tu entrada</p><h2>${esc(g.name)}</h2><p>Has marcado que no vienes. Si cambias de idea, actualízalo más abajo.</p>`
  :waiting?`<p style="margin:0">${esc(g.name)}, estás en la lista de espera</p><div class="due"><span class="big">Puesto ${esc(g.wait_pos)}</span></div><p>Si alguien se da de baja pasas solo, y aquí verás lo que te toca pagar.</p>`
  :`<p style="margin:0">${isNew?'¡Ya estás dentro, ':'Hola, '}${esc(g.name)}${isNew?'!':''}</p><div class="due"><span class="big">${eur(m.per_person)}</span>${g.paid?'<span class="stamp paid">Pagado</span>':''}</div>
    <p>${g.paid?'Tu parte está pagada. ¡Nos vemos el 31!':g.claimed?'Has avisado de que ya pagaste. Falta que tu recaudador lo confirme.':`Es lo que te toca poner${ev.pay_deadline?`, antes del ${fdate(ev.pay_deadline)}`:''}.`}${g.status==='quiza'?' Has marcado «quizá».':''}</p>`;
 const body=out||waiting?`<p style="margin:0">${d.invited_by?`Te apuntó ${esc(d.invited_by)}. `:''}Mientras tanto, guarda tu enlace para volver.</p>`
  :g.paid?`<p style="margin:0">${d.invited_by?`Te apuntó ${esc(d.invited_by)}. `:''}No tienes que hacer nada más.</p>`
  :c?`<span class="sub" style="display:block;margin:0 0 2px">${cash?'Dale el dinero en mano a':'Haz un Bizum a'}</span>
    <div class="paybox"><span class="who">${esc(c.name)}</span>${!cash&&c.phone?`<button class="btn2 sm" type="button" id="me-copynum">Copiar número</button><span class="num">${esc(c.phone)}</span>`:''}</div>
    ${!cash?`<div class="callout"><div class="paybox"><span><span class="sub" style="display:block;margin:0;font-size:14px">Con el concepto</span><b>${esc(concept(g.name))}</b></span><button class="btn2 sm" type="button" id="me-copyconcept">Copiar</button></div></div>`:''}
    ${ev.pay_how&&!cash?`<p class="sub" style="margin:10px 0 0">${esc(ev.pay_how)}</p>`:''}
    ${cash?`<p class="warn">${CASH_WARN}</p>`:''}
    ${g.claimed?`<p class="msg ok" style="margin-top:16px">Avisado. Cuando lo compruebe, aquí saldrá el sello de pagado.</p><button class="ghost" type="button" id="unclaim" style="padding:0">Me he equivocado, aún no he pagado</button>`
     :`<button class="btn green wide" type="button" id="claim" style="margin-top:18px">${cash?'Ya le he dado el dinero':'Ya he hecho el Bizum'}</button><p class="sub" style="margin:8px 0 0;font-size:14px;text-align:center">Así tu recaudador sabe que tiene que mirarlo.</p>`}`
  :`<p style="margin:0">Todavía no hay recaudadores. En cuanto los pongan, aquí verás a quién pagar.</p>`;
 v.innerHTML=`<div class="ticket"><div class="stub">${stub}</div><div class="body">${body}</div></div>`;
 const comp=d.companions||[];
 $('below').innerHTML=`<div class="narrow">
  ${wa&&!out&&!waiting?`<div class="callout wa block"><h3 style="margin:0">${isNew?'Último paso: entra al grupo':'El grupo de la fiesta'}</h3><p class="sub" style="margin:4px 0 12px">Ahí avisamos de todo: cambios, pagos y lo que falta.</p>

   <div class="row" style="justify-content:space-between"><label class="row" style="gap:6px;font-size:14px"><input type="checkbox" data-f="active"${c.active?' checked':''}> Activo</label>
   <button class="ghost" type="button" data-del aria-label="Borrar a ${esc(c.name)}">Borrar</button></div></div>`}).join('')||'<p class="msg">Todavía no hay recaudadores. Añade 3 o 4 abajo.</p>'}</div>
  <form class="add three" id="cAdd" autocomplete="off"><input type="text" id="c-name" placeholder="Nombre" required maxlength="40" aria-label="Nombre"><input type="tel" id="c-phone" placeholder="Número de Bizum" maxlength="30" aria-label="Número de Bizum"><button class="btn" type="submit">Añadir recaudador</button></form></section>`;
 const grid=$('pane').querySelector('.colgrid');
 grid.addEventListener('change',e=>{const box=e.target.closest('.col[data-id]');if(!box)return;const val=f=>box.querySelector(`[data-f="${f}"]`);
  act('admin_collector_save',{p_id:box.dataset.id,p_name:val('name').value,p_phone:val('phone').value,p_active:val('active').checked})});
 grid.addEventListener('click',e=>{const l=e.target.closest('[data-clink]');if(l){copy(collectorLink(l.dataset.clink),l);return}
  const d=e.target.closest('[data-del]');if(d){const id=d.closest('.col').dataset.id;confirm2(d,'¿Seguro?',()=>act('admin_collector_delete',{p_id:id}))}});
 $('cAdd').addEventListener('submit',e=>{e.preventDefault();act('admin_collector_save',{p_id:null,p_name:$('c-name').value,p_phone:$('c-phone').value,p_active:true})});
 $('reshuffle').addEventListener('click',e=>confirm2(e.target,'¿Seguro? Pulsa otra vez',()=>act('admin_collectors_reshuffle',{})));
}
function paneCompra(){const I=A.items,m=A.money;
 $('pane').innerHTML=`<section class="card"><h2>Compra y gastos</h2><p class="sub">«€/ud» es lo previsto y sirve para calcular lo que pone cada uno. Cuando compréis algo, apunta en «Gastado» lo que costó de verdad: así sale el bote disponible. Marca «Extra» para lo que solo se compra si sobra dinero.</p>
  <div class="scroll"><table class="stack"><thead><tr><th>Qué</th><th>Tipo</th><th class="num">Cant.</th><th class="num">€/ud</th><th class="num">Previsto</th><th class="num">Gastado</th><th>Quién</th><th>Comprado</th><th>Extra</th><th></th></tr></thead><tbody>
  ${I.map(i=>`<tr data-id="${esc(i.id)}">
   <td class="first"><input type="text" data-f="name" value="${esc(i.name)}" maxlength="120" aria-label="Qué" style="min-width:170px"></td>
   <td data-l="Tipo"><select data-f="cat" aria-label="Tipo">${CATS.map(c=>`<option${c===i.cat?' selected':''}>${c}</option>`).join('')}</select></td>
   <td data-l="Cantidad" class="num"><input type="number" data-f="q" value="${esc(num(i.q))}" min="0" step="1" style="width:72px" aria-label="Cantidad"></td>
   <td data-l="€ por unidad" class="num"><input type="number" data-f="p" value="${esc(num(i.p))}" min="0" step="0.05" style="width:88px" aria-label="Precio previsto"></td>
   <td data-l="Previsto" class="num"><b>${eur(num(i.q)*num(i.p))}</b></td>
   <td data-l="Gastado" class="num"><input type="number" data-f="spent" value="${i.spent==null?'':esc(num(i.spent))}" min="0" step="0.01" style="width:92px" placeholder="—" aria-label="Gastado de verdad"></td>
   <td data-l="Quién"><input type="text" data-f="who" value="${esc(i.who)}" maxlength="40" aria-label="Quién lo compra" style="min-width:90px"></td>
   <td data-l="Comprado"><label class="tick"><input type="checkbox" data-f="done"${i.done?' checked':''} aria-label="Comprado"></label></td>
   <td data-l="Extra"><label class="tick"><input type="checkbox" data-f="opt"${i.opt?' checked':''} aria-label="Solo si sobra dinero"></label></td>
   <td class="del"><button class="ghost" type="button" data-del aria-label="Borrar ${esc(i.name)}">✕</button></td></tr>`).join('')||'<tr><td colspan="10" class="msg">La lista está vacía.</td></tr>'}
  </tbody></table></div>
  <form class="add items" id="iAdd" autocomplete="off"><input type="text" id="i-name" placeholder="Añadir cosa" required maxlength="120" aria-label="Qué">
   <select id="i-cat" aria-label="Tipo">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
   <input type="number" id="i-q" value="1" min="0" step="1" aria-label="Cantidad"><input type="number" id="i-p" value="0" min="0" step="0.05" aria-label="Precio por unidad"><button class="btn" type="submit">Añadir</button></form>
  <p class="sub" style="margin-top:12px">Previsto: <b>${eur(m.total)}</b> · Gastado de verdad: <b>${eur(A.spent)}</b> · Recaudado: <b>${eur(m.collected)}</b> · Bote: <b>${eur(m.collected-num(A.spent))}</b>${m.extra?` · Extras: ${eur(m.extra)}`:''}</p></section>`;
 const tb=$('pane').querySelector('tbody');
 tb.addEventListener('change',e=>{const tr=e.target.closest('tr[data-id]');if(!tr)return;const val=f=>tr.querySelector(`[data-f="${f}"]`);const sp=val('spent').value.trim();
  act('admin_item_save',{p_id:tr.dataset.id,p_name:val('name').value,p_cat:val('cat').value,p_q:num(val('q').value),p_p:num(val('p').value),p_who:val('who').value,p_done:val('done').checked,p_opt:val('opt').checked,p_spent:sp===''?null:num(sp)})});
 tb.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(!d)return;const id=d.closest('tr').dataset.id;confirm2(d,'¿Borrar?',()=>act('admin_item_delete',{p_id:id}))});
 $('iAdd').addEventListener('submit',e=>{e.preventDefault();act('admin_item_save',{p_id:null,p_name:$('i-name').value,p_cat:$('i-cat').value,p_q:num($('i-q').value),p_p:num($('i-p').value),p_who:'',p_done:false,p_opt:false,p_spent:null})});
}
function paneDatos(){const ev=A.event,fixed=ev.people_override!=null;
 $('pane').innerHTML=`<div class="grid"><section class="card"><h2>Datos de la fiesta</h2><p class="sub">Esto es lo que ve todo el mundo.</p>
  <form class="stack-form" id="sForm">
   <label class="f">Nombre de la fiesta<input type="text" id="e-name" maxlength="60" value="${esc(ev.event_name)}"></label>
   <div class="two"><label class="f">Hora de llegada<input type="time" id="e-start" value="${esc(ev.start_time)}"></label><label class="f">Hasta<input type="text" id="e-end" maxlength="40" value="${esc(ev.end_time)}" placeholder="p. ej. 06:00"></label></div>
   <label class="f">Nombre del local<input type="text" id="e-place" maxlength="80" value="${esc(ev.place)}"></label>
   <label class="f">Dirección<input type="text" id="e-addr" maxlength="160" value="${esc(ev.addr)}"></label>
   <div class="two"><label class="f">Apuntarse hasta <small>incluido; vacío = sin límite</small><input type="date" id="e-sdl" value="${esc(ev.signup_deadline||'')}"></label>
   <label class="f">Pagar hasta<input type="date" id="e-pdl" value="${esc(ev.pay_deadline||'')}"></label></div>
   <label class="f">Aforo máximo <small>Solo cuentan los «sí». Al llenarse, los nuevos van a lista de espera y pasan solos cuando alguien se da de baja. Vacío = sin límite.</small><input type="number" id="e-cap" min="1" max="300" value="${esc(ev.capacity??'')}" style="max-width:140px"></label>
   <label class="f">Instrucciones de pago <small>Se añaden a lo que ve cada uno junto a su recaudador</small><textarea id="e-payhow" maxlength="200">${esc(ev.pay_how)}</textarea></label>
   <label class="f">Nota para todos<textarea id="e-notes" maxlength="400">${esc(ev.notes)}</textarea></label>
   <label class="f">Contacto de un gestor <small>Sale para quien no quiera dar su teléfono o haya olvidado el PIN, p. ej. «Juan · 600 000 000»</small><input type="text" id="e-contact" maxlength="120" value="${esc(ev.admin_contact)}"></label>
   <label class="f">Enlace del grupo de WhatsApp <small>Solo lo ve quien ya se ha apuntado, en su ficha</small><input type="url" id="e-wa" maxlength="200" value="${esc(A.whatsapp_url)}" placeholder="https://chat.whatsapp.com/…"></label>
   <fieldset style="border:1px solid var(--line);border-radius:12px;padding:12px 14px"><legend style="font-weight:600;padding:0 6px">Repartir el gasto</legend>
    <label class="row"><input type="radio" name="div" value="conf"${fixed?'':' checked'}> Entre los confirmados (${A.money.si})</label>
    <label class="row" style="margin-top:8px"><input type="radio" name="div" value="fixed"${fixed?' checked':''}> Entre un número fijo: <input type="number" id="e-people" min="1" max="500" value="${esc(ev.people_override??35)}" style="width:96px" aria-label="Número de personas"></label></fieldset>
   <button class="btn" type="submit">Guardar datos</button></form></section>
  <div><section class="card"><h2>Preguntas frecuentes</h2><p class="sub">Salen al final de la página de inicio. Añade lo que os pregunte la gente: guardarropa, hora de cierre de la puerta, cómo llegar…</p>
   <div id="faqList">${(ev.faq||[]).map(f=>`<div class="faqrow"><div class="stack-form" style="gap:6px"><input type="text" data-q maxlength="140" value="${esc(f.q)}" aria-label="Pregunta" placeholder="Pregunta"><textarea data-a maxlength="600" aria-label="Respuesta" placeholder="Respuesta">${esc(f.a)}</textarea></div><button class="ghost" type="button" data-fdel aria-label="Quitar pregunta">Quitar</button></div>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn2 sm" type="button" id="faqAdd">Añadir pregunta</button><button class="btn sm" type="button" id="faqSave">Guardar preguntas</button></div></section>
  <section class="card" style="margin-top:18px"><h2>PIN de gestores</h2><p class="sub">Cambia el PIN si alguien que no debería lo conoce. Los demás gestores tendrán que usar el nuevo.</p>
   <form class="stack-form" id="pForm"><label class="f">PIN nuevo<input type="password" id="p-new" minlength="6" required autocomplete="new-password"></label>
   <label class="f">Repítelo<input type="password" id="p-new2" minlength="6" required autocomplete="new-password"></label><button class="btn2" type="submit">Cambiar PIN</button><p class="msg" id="pMsg"></p></form></section></div></div>`;
 $('sForm').addEventListener('submit',e=>{e.preventDefault();const f=document.querySelector('input[name=div]:checked').value==='fixed',cap=$('e-cap').value.trim();
  act('admin_settings_save',{p:{event_name:$('e-name').value,start_time:$('e-start').value,end_time:$('e-end').value,place:$('e-place').value,addr:$('e-addr').value,pay_how:$('e-payhow').value,notes:$('e-notes').value,admin_contact:$('e-contact').value,whatsapp_url:$('e-wa').value,
   signup_deadline:$('e-sdl').value,pay_deadline:$('e-pdl').value,capacity:cap?String(Math.max(1,Math.round(num(cap)))):'',people_override:f?String(Math.max(1,Math.round(num($('e-people').value))||1)):''}})});
 const fl=$('faqList');
 $('faqAdd').addEventListener('click',()=>{fl.insertAdjacentHTML('beforeend',`<div class="faqrow"><div class="stack-form" style="gap:6px"><input type="text" data-q maxlength="140" aria-label="Pregunta" placeholder="Pregunta"><textarea data-a maxlength="600" aria-label="Respuesta" placeholder="Respuesta"></textarea></div><button class="ghost" type="button" data-fdel aria-label="Quitar pregunta">Quitar</button></div>`);fl.lastElementChild.querySelector('input').focus()});
 fl.addEventListener('click',e=>{const b=e.target.closest('[data-fdel]');if(b)b.closest('.faqrow').remove()});
 $('faqSave').addEventListener('click',()=>act('admin_settings_save',{p:{faq:[...fl.querySelectorAll('.faqrow')].map(r=>({q:r.querySelector('[data-q]').value,a:r.querySelector('[data-a]').value})).filter(f=>f.q.trim())}}));
 $('pForm').addEventListener('submit',async e=>{e.preventDefault();const n=$('p-new').value,msg=$('pMsg');
  if(n!==$('p-new2').value){msg.className='msg err';msg.textContent='Los PIN no coinciden';return}
  try{await rpc('admin_change_pin',{p_pin:pin(),p_new:n});sess.set('nv_pin',n);msg.className='msg ok';msg.textContent='PIN cambiado.';e.target.reset()}catch(err){msg.className='msg err';msg.textContent=err.message}});
}

/* ================= arranque ================= */
async function route(){const q=new URLSearchParams(location.search),tok=q.get('t'),rtok=q.get('r');
 try{if(location.hash==='#gestion')await viewAdmin();else if(rtok)await viewCollector(rtok);else if(tok)await viewMe(tok);else await viewHome()}
 catch(err){$('view').innerHTML=`<section class="card"><h2>No se ha podido cargar</h2><p class="sub">${esc(err.message)}</p><button class="btn" type="button" onclick="location.reload()">Reintentar</button></section>`}}
window.addEventListener('hashchange',()=>{if(location.hash==='#gestion'||location.hash==='')route()});
route();
}
</script>
